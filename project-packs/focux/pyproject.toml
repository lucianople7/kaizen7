[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focux-factory"
version = "0.1.0"
description = "THE FOCUX audiovisual factory: shared local CLI and MCP core"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Pillow>=11,<13", "numpy>=2,<3", "mcp==2.2.0"]

[project.scripts]
focux = "focux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/focux/skills/focux-brand-placement" = ["skills/focux-brand-placement/SKILL.md"]
"share/focux/skills/focux-brand-placement/fixtures" = ["skills/focux-brand-placement/fixtures/baseline.json", "skills/focux-brand-placement/fixtures/cases.json"]
"share/focux/skills/focux-brand-placement/references" = ["skills/focux-brand-placement/references/contract.md"]
"share/focux/skills/focux-brand-placement/scripts" = ["skills/focux-brand-placement/scripts/selftest.py"]
"share/focux/skills/focux-critic" = ["skills/focux-critic/SKILL.md"]
